name: "CI tests"

on:
  push:
    branches: [deadline_0]


runs-on: ubuntu-latest

steps:
  - uses: actions/checkout@v2

  - name: Install Dependencies
    run: |
      sudo apt-get install -y build-essential cmake cpputest

  - name: CMake
    run: |
      cmake -B build
      cd build
      cmake --build .

  - name: Test
    run: |
      cd build
      ctest