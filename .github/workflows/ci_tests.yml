name: "CI tests"

on:
  push:
    branches: [deadline_0]


jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create CMake cache
        run: |
          cmake -S . -B cmake-build-debug
      
      - name: Check files
        run: find src -name Statement.h
        run: head -n 5 src/value/Value.h


      - name: Build tests target
        run: |
          cmake --build cmake-build-debug --target itmoscript_tests

      - name: Run tests
        working-directory: .\cmake-build-debug
        run: |
          ctest